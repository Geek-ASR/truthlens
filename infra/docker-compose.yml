x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://truthlens:truthlens@postgres:5432/truthlens
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-truthlens}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-truthlens-dev-key}
  S3_BUCKET: ${S3_BUCKET:-truthlens-media}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/truthlens-media}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  # host.docker.internal reaches the Mac host's `ollama serve` from inside
  # the container (Docker Desktop only) — override if Ollama runs elsewhere.
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  SEARCH_API_KEY: ${SEARCH_API_KEY}
  SEARCH_PROVIDER: ${SEARCH_PROVIDER:-tavily}
  TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-openai}
  META_APP_ID: ${META_APP_ID}
  META_APP_SECRET: ${META_APP_SECRET}
  META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v21.0}
  INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN}
  HUMAN_APPROVAL_MODE: ${HUMAN_APPROVAL_MODE:-true}
  MAX_POSTS_PER_DAY: ${MAX_POSTS_PER_DAY:-12}
  CORS_ORIGINS: '["http://localhost:3000"]'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: truthlens
      POSTGRES_PASSWORD: truthlens
      POSTGRES_DB: truthlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truthlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-truthlens}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-truthlens-dev-key}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build: ../backend
    command: celery -A app.workers.celery_app worker --loglevel=info
    environment: *backend-env
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ../backend
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment: *backend-env
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ../frontend
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
